# No selector: pods in this namespace are not backends yet.
# Callers keep using myservice.myservice.svc.cluster.local. The manual
# EndpointSlice is the VM. Adding a selector later is the cutover.
kind: Service
apiVersion: v1
metadata:
  name: myservice
  namespace: myservice
spec:
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
