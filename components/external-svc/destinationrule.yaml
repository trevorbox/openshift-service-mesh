apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: myservice
spec:
  host: myservice.myservice.svc.cluster.local
  subsets:
  - name: ext-zone-a
    labels:
      zone: a # ServiceEntry endpoint labels
  - name: ext-zone-b
    labels:
      zone: b # ServiceEntry endpoint labels
  - name: pods-v1
    labels:      
      version: v1 # Pod labels
