apiVersion: tower.ansible.com/v1alpha1
kind: AnsibleCredential
metadata:
  name: openshift-pod-restart
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  connection_secret: aap-access
  name: openshift-pod-restart
  organization: Default
  description: Token for the eda-pod-restart service account. Delete pods in spring-boot-demo only.
  type: OpenShift or Kubernetes API Bearer Token
  kubernetes_api: https://kubernetes.default.svc
  # Secret key token. External Secrets can replace this Secret. The resource
  # operator reads it once, when this credential job runs.
  kubernetes_bearer_token_secret: eda-pod-restart-token
