apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: myservice
spec:
  hosts:
  - myservice.myservice.svc.cluster.local
  http:
    # 1. Match specific header for canary subset
    - match:
      - headers:
          x-zone:
            exact: b      # Routes if header 'x-zone: b' matches exactly
      route:
      - destination:
          host: myservice.myservice.svc.cluster.local
          subset: ext-zone-b

    # 2. Fallback rule for all other traffic
    - route:
      - destination:
          host: myservice.myservice.svc.cluster.local
          subset: ext-zone-a
      # 3. Add this in when pods are deployed
      #   weight: 50
      # - destination:
      #     host: myservice.myservice.svc.cluster.local
      #     subset: pods-v1
      #   weight: 50
