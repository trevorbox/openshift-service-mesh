# Copies the ObjectBucketClaim credentials into the secret keys Tempo expects.
apiVersion: batch/v1
kind: Job
metadata:
  name: tempo-s3-credentials
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 2100
  template:
    spec:
      serviceAccountName: tempo-s3-credentials
      restartPolicy: Never
      containers:
        - name: credentials
          image: quay.io/openshift/origin-cli:4.16
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              ns=tempo-system
              claim=tempo
              for _ in $(seq 1 120); do
                if oc get secret "$claim" -n "$ns" >/dev/null 2>&1 \
                  && oc get configmap "$claim" -n "$ns" >/dev/null 2>&1; then
                  host=$(oc get configmap "$claim" -n "$ns" -o jsonpath='{.data.BUCKET_HOST}')
                  if [ -n "$host" ]; then
                    break
                  fi
                fi
                sleep 15
              done
              host=$(oc get configmap "$claim" -n "$ns" -o jsonpath='{.data.BUCKET_HOST}')
              port=$(oc get configmap "$claim" -n "$ns" -o jsonpath='{.data.BUCKET_PORT}')
              bucket=$(oc get configmap "$claim" -n "$ns" -o jsonpath='{.data.BUCKET_NAME}')
              access=$(oc get secret "$claim" -n "$ns" -o jsonpath='{.data.AWS_ACCESS_KEY_ID}' | base64 -d)
              secret=$(oc get secret "$claim" -n "$ns" -o jsonpath='{.data.AWS_SECRET_ACCESS_KEY}' | base64 -d)
              if [ -z "$host" ] || [ -z "$bucket" ] || [ -z "$access" ] || [ -z "$secret" ]; then
                echo "object bucket claim ${claim} is not ready" >&2
                exit 1
              fi
              endpoint="https://${host}"
              if [ -n "$port" ]; then
                endpoint="https://${host}:${port}"
              fi
              oc create secret generic tempo-s3 -n "$ns" \
                --from-literal=bucket="$bucket" \
                --from-literal=endpoint="$endpoint" \
                --from-literal=access_key_id="$access" \
                --from-literal=access_key_secret="$secret" \
                --dry-run=client -o yaml | oc apply -f -
