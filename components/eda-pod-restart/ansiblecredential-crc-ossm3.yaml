apiVersion: tower.ansible.com/v1alpha1
kind: AnsibleCredential
metadata:
  name: crc-ossm3
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  connection_secret: aap-access
  name: crc-ossm3
  organization: Default
  description: Bearer token for the crc-ossm3 API. The alert label cluster must match this name.
  type: OpenShift or Kubernetes API Bearer Token
  # API of the cluster that emits the alert. Use that cluster's API URL when
  # AAP runs somewhere else, and store a token from that cluster in the secret.
  kubernetes_api: https://kubernetes.default.svc
  kubernetes_bearer_token_secret: eda-pod-restart-token
