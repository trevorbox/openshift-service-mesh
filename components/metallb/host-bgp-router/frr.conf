! CRC host BGP peer for MetalLB on OpenShift Local.
! ASN 64501 peers with MetalLB FRR-K8s (ASN 64500) at 192.168.130.11.
frr defaults traditional
hostname crc-host
log stdout informational
service integrated-vtysh-config
!
router bgp 64501
 bgp router-id 192.168.130.1
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 no bgp network import-check
 neighbor 192.168.130.11 remote-as 64500
 neighbor 192.168.130.11 description metallb-frr-k8s
 neighbor 192.168.130.11 timers 5 15
 !
 address-family ipv4 unicast
  neighbor 192.168.130.11 activate
  neighbor 192.168.130.11 soft-reconfiguration inbound
  neighbor 192.168.130.11 route-map IMPORT-METALLB in
 exit-address-family
exit
!
ip prefix-list METALLB-VIPS seq 10 permit 192.168.200.0/24 le 32
!
route-map IMPORT-METALLB permit 10
 match ip address prefix-list METALLB-VIPS
exit
!
