apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # - namespace.yaml
  # - service.yaml
  - endpointslice.yaml
  # remove this once the new service is ready
  # - destinationrule.yaml
  - serviceaccount.yaml

helmCharts:
- name: golang-ex
  repo: https://trevorbox.github.io/helm-charts
  namespace: myservice
  valuesFile: values.yaml
  # version: ~0.1.1
  version: ~0.2.1
  releaseName: myservice

# to cutover to the new service, we need to keep the selector and set endpointSlice ready to false

patches:
  - target:
      group: ""
      version: v1
      kind: Service
      name: myservice
    patch: |-
      # - op: remove
      #   path: /spec/selector
      - op: replace
        path: /spec/ports
        value:
          - name: http
            protocol: TCP
            port: 80
            targetPort: 8080
  - target:
        group: discovery.k8s.io
        version: v1
        kind: EndpointSlice
        name: myservice-external
        namespace: myservice
    patch: |-
      - op: replace
        path: /endpoints/0/conditions/ready
        value: false
