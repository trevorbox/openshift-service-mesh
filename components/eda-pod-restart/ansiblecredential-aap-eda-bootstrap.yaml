apiVersion: tower.ansible.com/v1alpha1
kind: AnsibleCredential
metadata:
  name: aap-eda-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  connection_secret: aap-access
  name: aap-eda-bootstrap
  organization: Default
  description: Reads aap-access and eda-webhook-token while configure-aap-eda runs.
  type: OpenShift or Kubernetes API Bearer Token
  kubernetes_api: https://kubernetes.default.svc
  kubernetes_bearer_token_secret: aap-eda-bootstrap-token
