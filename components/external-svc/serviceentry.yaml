apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: myservice
  namespace: myservice
  # labels:
  #   networking.istio.io/enable-autoallocate-ip: "false"
spec:
  hosts:
    - myservice.myservice.svc.cluster.local
  endpoints:
    - address: 192.168.130.50
  location: MESH_EXTERNAL
  ports:
    - name: http
      number: 80
      protocol: HTTP
      targetPort: 8080
  resolution: DNS
